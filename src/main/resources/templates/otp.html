<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Verify OTP</title>
</head>

<body>

<h2>OTP Verification</h2>

<h3>

Generated OTP:

<span th:text="${otp}"></span>

</h3>

<form action="/verify-otp"
      method="post">

<input type="text"
       name="otp"
       placeholder="Enter OTP"
       required>

<button type="submit">

Verify OTP

</button>

</form>

<p th:text="${message}"></p>

</body>

</html>
