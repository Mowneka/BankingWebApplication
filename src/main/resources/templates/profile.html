<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Profile</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.container{
    width:500px;
    margin:auto;
    margin-top:80px;
    background:#1e293b;
    padding:40px;
    border-radius:20px;
}

h2{
    text-align:center;
    margin-bottom:30px;
}

p{
    font-size:20px;
    margin:20px 0;
}

</style>

</head>

<body>

<div class="container">

<h2>User Profile</h2>

<p>
Username :
<span th:text="${user.username}"></span>
</p>

<p>
Balance :
₹ <span th:text="${user.balance}"></span>
</p>

<p>
Role :
<span th:text="${user.role}"></span>
</p>

</div>

</body>
</html>
