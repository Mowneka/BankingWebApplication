<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Transfer Money</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.container{
    width:450px;
    margin:80px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.message{
    text-align:center;
    margin-top:20px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Transfer Money</h2>

<form th:action="@{/transfer}" method="post">

<input type="text"
       name="senderAccount"
       placeholder="Sender Account Number"
       required>

<input type="text"
       name="receiverAccount"
       placeholder="Receiver Account Number"
       required>

<input type="number"
       step="0.01"
       name="amount"
       placeholder="Amount"
       required>

<button type="submit">
Transfer Money
</button>

</form>

<p class="message"
   th:text="${success}">
</p>

</div>

</div>

</body>
</html>
