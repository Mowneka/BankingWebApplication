<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Loan Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#08152f,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
width:100%;
max-width:1100px;
background:#27324b;
padding:40px;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

h1{
color:white;
margin-bottom:30px;
font-size:48px;
}

input,
select{
width:100%;
padding:15px;
margin-bottom:18px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#3267e3;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.emi-box{
margin-top:25px;
color:white;
font-size:32px;
font-weight:bold;
}

.docs-title{
margin-top:35px;
margin-bottom:15px;
color:white;
font-size:32px;
}

.documents-box{
background:#3f4a63;
padding:25px;
border-radius:15px;
min-height:280px;
color:white;
}

.loan-heading{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
color:#60a5fa;
}

.documents-box ul{
padding-left:25px;
}

.documents-box li{
margin-bottom:10px;
}

.loan-warning{
margin-top:20px;
padding:15px;
background:#f59e0b;
color:black;
border-radius:10px;
font-weight:bold;
}

.message{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#4ade80;
}

</style>

</head>

<body>

<div class="container">

<h1>Loan Application</h1>

<form action="/applyLoan" method="post">

<input type="text"
       name="username"
       placeholder="Username"
       required>

<select id="loanType"
        name="loanType"
        onchange="updateDocuments()">

<option value="HOME">Home Loan</option>

<option value="CAR">Car Loan</option>

<option value="EDUCATION">Education Loan</option>

<option value="PERSONAL">Personal Loan</option>

</select>

<input type="number"
       name="loanAmount"
       placeholder="Loan Amount"
       required>

<input type="number"
       name="interestRate"
       placeholder="Interest Rate"
       required>

<input type="number"
       name="tenure"
       placeholder="Tenure in Months"
       required>

<button type="submit">
Calculate EMI & Apply
</button>

</form>

<div class="message"
     th:text="${message}">
</div>

<div class="emi-box">

EMI:
<span th:text="${emi}"></span>

</div>

<h2 class="docs-title">

Required Documents

</h2>

<div id="documents"
     class="documents-box">

</div>

</div>

<script>

function updateDocuments(){

let loanType =
document.getElementById("loanType").value;

let docs =
document.getElementById("documents");

if(loanType==="HOME"){

docs.innerHTML=`

<div class="loan-heading">
🏠 Home Loan Documents
</div>

<ul>
<li>Aadhaar Card</li>
<li>PAN Card</li>
<li>Passport Size Photos</li>
<li>Address Proof</li>
<li>Bank Statement (Last 6 Months)</li>
<li>Salary Slips (Last 3 Months)</li>
<li>Income Tax Returns / Form 16</li>
<li>Employment ID</li>
<li>Property Sale Agreement</li>
<li>Property Tax Receipt</li>
<li>Encumbrance Certificate</li>
<li>Approved Building Plan</li>
<li>Occupancy Certificate</li>
</ul>

<div class="loan-warning">
For loans above ₹25 Lakhs, Property Documents,
Asset Ownership Proof, and Valuation Reports are mandatory.
</div>
`;

}

else if(loanType==="EDUCATION"){

docs.innerHTML=`

<div class="loan-heading">
🎓 Education Loan Documents
</div>

<ul>
<li>Aadhaar Card</li>
<li>PAN Card</li>
<li>Passport Size Photos</li>
<li>Admission Letter</li>
<li>College Fee Structure</li>
<li>Academic Mark Sheets</li>
<li>Transfer Certificate</li>
<li>Parent Income Proof</li>
<li>Parent Salary Slips</li>
<li>Bank Statements</li>
<li>Income Tax Returns</li>
<li>Co-applicant Aadhaar & PAN</li>
</ul>

<div class="loan-warning">
For loans above ₹7.5 Lakhs, Property Documents,
Fixed Deposits, or Asset Documents may be required.
</div>
`;

}

else if(loanType==="CAR"){

docs.innerHTML=`

<div class="loan-heading">
🚗 Car Loan Documents
</div>

<ul>
<li>Aadhaar Card</li>
<li>PAN Card</li>
<li>Passport Size Photos</li>
<li>Driving License</li>
<li>Address Proof</li>
<li>Salary Slips</li>
<li>Bank Statements</li>
<li>Income Tax Returns</li>
<li>Vehicle Quotation</li>
</ul>

<div class="loan-warning">
For loans above ₹10 Lakhs, Additional Asset Verification
and Income Documents may be required.
</div>
`;

}

else if(loanType==="PERSONAL"){

docs.innerHTML=`

<div class="loan-heading">
👤 Personal Loan Documents
</div>

<ul>
<li>Aadhaar Card</li>
<li>PAN Card</li>
<li>Passport Size Photos</li>
<li>Address Proof</li>
<li>Salary Slips</li>
<li>Bank Statements</li>
<li>Income Tax Returns</li>
<li>Employment Proof</li>
</ul>

<div class="loan-warning">
For loans above ₹15 Lakhs, Additional Income Proof,
Asset Documents, and Credit Verification are required.
</div>
`;

}

}

window.onload = updateDocuments;

</script>

</body>
</html>
