<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Forgot Password</title>
</head>

<body>

<h2>Forgot Password</h2>

<form action="/generate-otp"
      method="post">

<input type="text"
       name="username"
       placeholder="Enter Username"
       required>

<button type="submit">

Generate OTP

</button>

</form>

<p th:text="${message}"></p>

</body>

</html>
