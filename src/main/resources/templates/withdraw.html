<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Withdraw Money</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:40px;
width:450px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:25px;
color:#dc2626;
}

.balance{
text-align:center;
margin-bottom:20px;
font-size:18px;
font-weight:bold;
color:#1e3a8a;
}

input{
width:100%;
padding:14px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#dc2626;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#b91c1c;
}

.message{
margin-top:20px;
text-align:center;
font-weight:bold;
color:green;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
font-weight:bold;
color:#1e3a8a;
}

</style>

</head>

<body>

<div class="card">

<h2>Withdraw Money</h2>

<form th:action="@{/withdraw}" method="post">

<input type="number"
       step="0.01"
       min="1"
       name="amount"
       placeholder="Enter Amount"
       required>

<button type="submit">
Withdraw
</button>

</form>

<p class="message"
   th:text="${message}">
</p>

<a href="/dashboard" class="back">
← Back to Dashboard
</a>

</div>

</body>

</html>
