<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-container">

    <div class="card">

        <h1>Create Account</h1>

       <form th:action="@{/register}" method="post">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <input type="text"
           name="aadhaarNumber"
           placeholder="Aadhaar Number"
           maxlength="12"
           required>

    <input type="text"
           name="mobileNumber"
           placeholder="Mobile Number"
           maxlength="10"
           required>

    <button type="submit">
        Register
    </button>

</form>

    </div>

</div>

</body>
</html>
